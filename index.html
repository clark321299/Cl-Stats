        (sess.diffs || []).forEach(d => {
            if (d.tank_name === tk.tank_name && d.battles > 0) {
                const swr = d.battles > 0 ? (d.wins / d.battles * 100) : 0;
                allSessHistory.push({
                    name: sess.name || "?",
                    battles: d.battles, wins: d.wins,
                    wr: swr,
                    avgDmg: d.battles > 0 ? Math.round(d.damage_dealt / d.battles) : 0,
                    avgSpot: d.battles > 0 ? ((d.spotted || 0) / d.battles).toFixed(1) : "—",
                    acc: fmtAccPct(d.hits, d.shots)
                });
            }
        });
    });

    const historyHtml = allSessHistory.length > 0 ? `
        <div style="border-top:1px solid var(--brd);padding-top:12px;margin-top:12px">
            <div style="font-size:.8rem;color:var(--t2);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">${t("sessTanks")} (${allSessHistory.length})</div>
            <div style="max-height:200px;overflow-y:auto">
                <table style="width:100%;border-collapse:collapse;font-size:.82rem">
                    <thead><tr>
                        <th style="text-align:left;padding:4px 8px;color:var(--acc);font-weight:600;border-bottom:1px solid var(--brd)">${t("sessionDefault")}</th>
                        <th style="padding:4px 8px;color:var(--acc);font-weight:600;border-bottom:1px solid var(--brd)">${t("sessBattles")}</th>
                        <th style="padding:4px 8px;color:var(--acc);font-weight:600;border-bottom:1px solid var(--brd)">${t("sessWR")}</th>
                        <th style="padding:4px 8px;color:var(--acc);font-weight:600;border-bottom:1px solid var(--brd)">${t("sessAvgDmg")}</th>
                        <th style="padding:4px 8px;color:var(--acc);font-weight:600;border-bottom:1px solid var(--brd)">${t("avgSpot")}</th>
                        <th style="padding:4px 8px;color:var(--acc);font-weight:600;border-bottom:1px solid var(--brd)">${t("accuracy")}</th>
                    </tr></thead>
                    <tbody>${allSessHistory.slice(-20).reverse().map(h => `<tr style="border-bottom:1px solid var(--brd)22">
                        <td style="padding:5px 8px;color:var(--t1)">${h.name}</td>
                        <td style="padding:5px 8px;text-align:center">${h.battles}</td>
                        <td style="padding:5px 8px;text-align:center" class="${getWrClass(h.wr)}">${h.wr.toFixed(1)}%</td>
                        <td style="padding:5px 8px;text-align:center">${h.avgDmg.toLocaleString()}</td>
                        <td style="padding:5px 8px;text-align:center">${h.avgSpot}</td>
                        <td style="padding:5px 8px;text-align:center">${h.acc}</td>
                    </tr>`).join("")}</tbody>
                </table>
            </div>
        </div>` : "";

    $("tankModalContent").innerHTML = `
        <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px">
            ${img ? `<div style="text-align:center;flex-shrink:0">${img}<div style="font-size:.72rem;color:var(--t2);margin-top:4px">${tierLabel} · ${typeLabel}</div></div>` : ""}
            <div style="flex:1;min-width:180px">
                <div style="font-size:1.2rem;font-weight:700;margin-bottom:12px;${nc}">${tk.tank_name || "?"}</div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
                    ${_miniStatCard(t("battles"), b.toLocaleString())}
                    ${_miniStatCard(t("winrate"), wr.toFixed(2) + "%", getWrClass(wr))}
                    ${_miniStatCard(t("avgDmg"), avgDmg.toLocaleString())}
                    ${_miniStatCard(t("avgFrags"), avgFrags)}
                    ${_miniStatCard(t("survival"), surv + "%")}
                    ${_miniStatCard(t("accuracy"), acc + (acc !== "—" ? "%" : ""))}
                    ${_miniStatCard(t("avgSpot"), avgSpot)}
                    ${_miniStatCard(t("avgDmgTaken"), avgTaken.toLocaleString())}
                    ${_miniStatCard(t("maxXP"), (s.max_xp || 0).toLocaleString())}
                    ${_miniStatCard(t("maxFrags"), s.max_frags || 0)}
                    ${_miniStatCard("K/D", kd)}
                    ${_miniStatCard(t("winsFor1Pct"), wr >= 99 ? "∞" : Math.ceil(b / (99 - wr)))}
                </div>
            </div>
        </div>
        ${historyHtml}`;

    $("tankModal").style.display = "block";
    document.body.style.overflow = "hidden";
}

function closeTankModal() {
    $("tankModal").style.display = "none";
    document.body.style.overflow = "";
}

// ==================== SESSIONS (MULTI) ====================
function getSessions() {
    return JSON.parse(localStorage.getItem("clstats_sessions") || "[]");
}

function saveSessions(sessions) {
    localStorage.setItem("clstats_sessions", JSON.stringify(sessions));
}

function _defaultSessionAutoReset() {
    return { enabled: false, period: "weekly", weekday: 1, monthday: 1, time: "03:00", lastRun: 0 };
}
function _sessionAutoResetCfg(sess) {
    const base = _defaultSessionAutoReset();
    const cfg = { ...base, ...(sess && sess.autoReset ? sess.autoReset : {}) };
    cfg.enabled = !!cfg.enabled;
    cfg.period = ["daily", "weekly", "monthly"].includes(cfg.period) ? cfg.period : "weekly";
    cfg.weekday = Math.max(1, Math.min(7, parseInt(cfg.weekday || 1, 10) || 1));
    cfg.monthday = Math.max(1, Math.min(31, parseInt(cfg.monthday || 1, 10) || 1));
    cfg.time = /^\d{2}:\d{2}$/.test(String(cfg.time || "")) ? cfg.time : "03:00";
    cfg.lastRun = Number(cfg.lastRun || 0);
    return cfg;
}

function _sessionBattleTotal(sess) {
    return (sess.diffs || []).reduce((s, d) => s + (d.battles || 0), 0);
}

function _ensureSessionPrimaryFlags(sessions) {
    const byAcc = {};
    sessions.forEach((s, i) => {
        const k = String(s.accountId || "unknown");
        if (!byAcc[k]) byAcc[k] = [];
        byAcc[k].push(i);
    });
    let changed = false;
    for (const indices of Object.values(byAcc)) {
        const primaries = indices.filter(i => sessions[i].isPrimary);
        if (primaries.length > 1) {
            for (let j = 1; j < primaries.length; j++) {
                sessions[primaries[j]].isPrimary = false;
                changed = true;
            }
            continue;
        }
        if (primaries.length === 1) continue;
        const allNamed = indices.filter(i => /^all$/i.test(String(sessions[i].name || "").trim()));
        if (!allNamed.length) continue;
        let pick = allNamed[0];
        if (allNamed.length > 1) {
            pick = allNamed.reduce((best, i) => _sessionBattleTotal(sessions[i]) > _sessionBattleTotal(sessions[best]) ? i : best, allNamed[0]);
        }
        sessions[pick].isPrimary = true;
        changed = true;
    }
    return changed;
}

function toggleSessionPrimary(idx) {
    const sessions = getSessions();
    const s = sessions[idx];
    if (!s) return;
    const accId = String(s.accountId || "unknown");
    if (s.isPrimary) {
        s.isPrimary = false;
    } else {
        sessions.forEach((x, i) => {
            if (String(x.accountId || "unknown") === accId) x.isPrimary = (i === idx);
        });
    }
    saveSessions(sessions);
    renderSessions();
}

function renderSessions() {
    const sessions = getSessions();
    let changedCfg = false;
    for (const s of sessions) {
        const norm = _sessionAutoResetCfg(s);
        if (!s.autoReset || JSON.stringify(s.autoReset) !== JSON.stringify(norm)) {
            s.autoReset = norm;
            changedCfg = true;
        }
    }
    if (_ensureSessionPrimaryFlags(sessions)) changedCfg = true;
    if (changedCfg) saveSessions(sessions);
    const container = $("sessionsContainer");
    const empty = $("sessionEmpty");

    // Save expanded state before re-render
    const expandedSet = new Set();
    container.querySelectorAll(".sess-draggable").forEach(el => {
        const det = el.querySelector("details");
        if (det && det.open) expandedSet.add(el.dataset.sess);
    });

    if (sessions.length === 0) {
        container.innerHTML = "";
        empty.classList.remove("hidden");
        return;
    }
    empty.classList.add("hidden");

    const autoExpand = $("sessAutoExpand") && $("sessAutoExpand").checked;
    const globalSettingsWasOpen = !!($("sessGlobalSettings") && $("sessGlobalSettings").classList.contains("open"));

    // Group sessions by account
    const groups = [];
    const groupMap = {};
    sessions.forEach((s, i) => {
        const key = s.accountId || "unknown";
        if (!groupMap[key]) {
            groupMap[key] = { nick: s.accountNick || "???", accountId: key, indices: [] };
            groups.push(groupMap[key]);
        }
        groupMap[key].indices.push(i);
    });

    const openMap = getSessGroupOpenMap();
    const isGroupOpen = (accountId) => {
        const key = String(accountId);
        return Object.prototype.hasOwnProperty.call(openMap, key) ? !!openMap[key] : true;
    };

    const otherPrimaryName = (sess, idx) => {
        const accId = String(sess.accountId || "unknown");
        for (let j = 0; j < sessions.length; j++) {
            if (j === idx) continue;
            const o = sessions[j];
            if (o.isPrimary && String(o.accountId || "unknown") === accId) return o.name || "?";
        }
        return "";
    };

    const renderCard = (s, i) => {
        const d = new Date(s.startTime);
        const timeStr = `${t("sessionStarted")} ${d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} (${d.toLocaleDateString()})`;
        const diffs = s.diffs || [];
        const tb = diffs.reduce((sum, d) => sum + d.battles, 0);
        const tw = diffs.reduce((sum, d) => sum + d.wins, 0);
        const td = diffs.reduce((sum, d) => sum + d.damage_dealt, 0);
        const tf = diffs.reduce((sum, d) => sum + d.frags, 0);
        const tsp = diffs.reduce((sum, d) => sum + (d.spotted || 0), 0);
        const wr = tb > 0 ? (tw / tb * 100) : 0;
        const avgDmg = tb > 0 ? Math.round(td / tb) : 0;
        const avgFrags = tb > 0 ? (tf / tb).toFixed(2) : "0";
        const avgSpot = tb > 0 ? (tsp / tb).toFixed(1) : "—";
        const ar = _sessionAutoResetCfg(s);
        const arLast = ar.lastRun ? new Date(ar.lastRun).toLocaleString() : t("sessAutoResetNever");
        const arNext = ar.enabled ? _nextRun(new Date(), ar).toLocaleString() : "—";
        const dowKeyMap = { 1: "dowMon", 2: "dowTue", 3: "dowWed", 4: "dowThu", 5: "dowFri", 6: "dowSat", 7: "dowSun" };
        let arHuman = `${t("sessAutoResetDaily")} ${ar.time}`;
        if (ar.period === "weekly") {
            arHuman = `${t("sessAutoResetWeekly")} ${t(dowKeyMap[ar.weekday] || "dowMon")} ${ar.time}`;
        } else if (ar.period === "monthly") {
            arHuman = `${t("sessAutoResetMonthly")} ${ar.monthday} ${ar.time}`;
        }
        const arBadge = ar.enabled
            ? `<span style="font-size:.68rem;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:1px 6px;letter-spacing:.02em">AUTO ${arHuman}</span>`
            : "";
        const primaryBadge = s.isPrimary
            ? `<span style="font-size:.68rem;color:#c9a227;border:1px solid #c9a227;border-radius:999px;padding:1px 6px;letter-spacing:.04em" title="${t("sessPrimaryHint")}">${t("sessPrimaryBadge")}</span>`
            : "";
        const settingsOpen = !!(s.settingsUiOpen || s.autoResetUiOpen);
        const otherPrim = otherPrimaryName(s, i);
        const primaryLabel = s.isPrimary
            ? fmtAdvice(t("sessPrimaryActive"), { name: s.name || "?" })
            : t("sessPrimary");
        const primaryHint = (!s.isPrimary && otherPrim)
            ? `<div style="font-size:.7rem;color:var(--t2);margin-top:2px;opacity:.9">${fmtAdvice(t("sessPrimaryMoveHint"), { name: otherPrim })}</div>`
            : "";

        return `<div class="tanks-section sess-draggable" style="margin-bottom:15px" data-sess="${i}" draggable="true">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <span class="drag-handle" title="Drag to reorder">&#9776;</span>
                    <strong style="color:var(--acc);font-size:1rem">${s.name}</strong>
                    ${primaryBadge}${arBadge}
                    <span style="color:var(--t2);font-size:.8rem">${timeStr}</span>
                </div>
                <div style="display:flex;gap:6px;align-items:center">
                    <button class="btn btn-sm" style="background:var(--bg2);color:var(--t1);border:1px solid var(--brd)" onclick="resetSession(${i})">${t("sessReset")}</button>
                    <button class="btn btn-ghost btn-sm sess-gear-btn" onclick="toggleSessionSettingsPanel(${i})" title="${t("sessSettings")}">&#9881;</button>
                </div>
            </div>
            <div class="sess-settings-panel${settingsOpen ? " open" : ""}">
                <div class="sess-settings-row">
                    <button class="btn btn-ghost btn-sm" onclick="renameSession(${i})">${t("sessRename")}</button>
                    <button class="btn btn-sm" style="background:var(--bg2);color:var(--t2);border:1px solid var(--brd)" onclick="archiveSession(${i})">${t("sessArchiveBtn")}</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSession(${i})">${t("sessionStop")}</button>
                </div>
                <div class="sess-settings-divider"></div>
                <div>
                    <label style="display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--t2);cursor:pointer" title="${t("sessPrimaryHint")}">
                        <input type="checkbox"${s.isPrimary ? " checked" : ""} onchange="toggleSessionPrimary(${i})">
                        <span>${primaryLabel}</span>
                    </label>
                    ${primaryHint}
                </div>
                <div class="sess-settings-divider"></div>
                <div class="sess-settings-row">
                    <label style="display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--t2);cursor:pointer">
                        <input type="checkbox" data-ar-idx="${i}" data-ar-field="enabled"${ar.enabled ? " checked" : ""}>
                        <span>${t("sessAutoResetEnable")}</span>
                    </label>
                    <select data-ar-idx="${i}" data-ar-field="period" style="padding:3px 5px;border:1px solid var(--brd);border-radius:6px;background:var(--bg-in);color:var(--t1);font-size:.75rem">
                        <option value="daily"${ar.period === "daily" ? " selected" : ""}>${t("sessAutoResetDaily")}</option>
                        <option value="weekly"${ar.period === "weekly" ? " selected" : ""}>${t("sessAutoResetWeekly")}</option>
                        <option value="monthly"${ar.period === "monthly" ? " selected" : ""}>${t("sessAutoResetMonthly")}</option>
                    </select>
                    <select data-ar-idx="${i}" data-ar-field="weekday" style="padding:3px 5px;border:1px solid var(--brd);border-radius:6px;background:var(--bg-in);color:var(--t1);font-size:.75rem;${ar.period === "weekly" ? "" : "display:none;"}">
                        <option value="1"${ar.weekday===1?" selected":""}>${t("dowMon")}</option><option value="2"${ar.weekday===2?" selected":""}>${t("dowTue")}</option><option value="3"${ar.weekday===3?" selected":""}>${t("dowWed")}</option><option value="4"${ar.weekday===4?" selected":""}>${t("dowThu")}</option><option value="5"${ar.weekday===5?" selected":""}>${t("dowFri")}</option><option value="6"${ar.weekday===6?" selected":""}>${t("dowSat")}</option><option value="7"${ar.weekday===7?" selected":""}>${t("dowSun")}</option>
                    </select>
                    <select data-ar-idx="${i}" data-ar-field="monthday" style="padding:3px 5px;border:1px solid var(--brd);border-radius:6px;background:var(--bg-in);color:var(--t1);font-size:.75rem;${ar.period === "monthly" ? "" : "display:none;"}">${Array.from({length:31},(_,k)=>`<option value="${k+1}"${ar.monthday===k+1?" selected":""}>${k+1}</option>`).join("")}</select>
                    <input data-ar-idx="${i}" data-ar-field="time" type="time" value="${ar.time}" style="padding:3px 5px;border:1px solid var(--brd);border-radius:6px;background:var(--bg-in);color:var(--t1);font-size:.75rem">
                </div>
                <span style="font-size:.72rem;color:var(--t2)">${t("sessAutoResetLast")}: ${arLast} • Next: ${arNext}</span>
            </div>
            <div class="session-stats-grid">
                <div class="session-stat-card"><div class="stat-value">${tb}</div><div class="stat-label">${t("sessBattles")}</div></div>
                <div class="session-stat-card"><div class="stat-value ${tb > 0 ? getWrClass(wr) : ''}">${tb > 0 ? wr.toFixed(1) + "%" : "—"}</div><div class="stat-label">${t("sessWR")}</div></div>
                <div class="session-stat-card"><div class="stat-value">${tb > 0 ? avgDmg.toLocaleString() : "—"}</div><div class="stat-label">${t("sessAvgDmg")}</div></div>
                <div class="session-stat-card"><div class="stat-value">${tb > 0 ? avgFrags : "—"}</div><div class="stat-label">${t("sessAvgFrags")}</div></div>
                <div class="session-stat-card"><div class="stat-value">${avgSpot}</div><div class="stat-label">${t("sessAvgSpot")}</div></div>
                ${typeof s.sessPerf === 'number' ? `<div class="session-stat-card"><div class="stat-value" style="color:${s.sessPerf >= 0 ? '#7ecb54' : '#e74c3c'}">${s.sessPerf >= 0 ? '+' : ''}${s.sessPerf.toFixed(1)}%</div><div class="stat-label">${t("sessVsAvg")}</div></div>` : ''}
            </div>
            ${renderBestWorstTank(diffs, i)}
            ${renderSessionAdvice(s, i)}
            ${diffs.length > 0 ? `<details${autoExpand || expandedSet.has(String(i)) ? " open" : ""}><summary style="cursor:pointer;color:var(--t2);font-size:.85rem;margin-bottom:8px">${t("sessTanks")} (${diffs.length})</summary>
            <div class="table-wrap">
                <table><thead><tr>
                    <th class="sortable sort-desc" data-sess-idx="${i}" data-ssort="name" style="cursor:pointer">${t("thTank")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="tier" style="cursor:pointer">${t("thTier")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="type" style="cursor:pointer">${t("thType")}</th>
                    <th class="sortable sort-desc" data-sess-idx="${i}" data-ssort="battles" style="cursor:pointer">${t("battles")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="wins" style="cursor:pointer">${t("wins")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="winrate" style="cursor:pointer">${t("winrate")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="avg_dmg" style="cursor:pointer">${t("avgDmg")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="avg_frags" style="cursor:pointer">${t("avgFrags")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="avg_spot" style="cursor:pointer">${t("avgSpot")}</th>
                    <th class="sortable" data-sess-idx="${i}" data-ssort="accuracy" style="cursor:pointer">${t("accuracy")}</th>
                </tr></thead><tbody id="sess-tbody-${i}">${renderSessionRows(diffs, "battles", "desc")}</tbody></table>
            </div></details>` : `<div style="text-align:center;color:var(--t2);padding:15px;font-size:.85rem">${t("noBattlesYet")}</div>`}
        </div>`;
    };

    if (groups.length === 1) {
        // Still wrap so top ⚙ account prefs can collapse even with one account group
        const g = groups[0];
        const isOpen = isGroupOpen(g.accountId);
        container.innerHTML = `<details class="sess-group" data-acc-id="${g.accountId}"${isOpen ? " open" : ""} style="margin-bottom:12px">
            <summary style="cursor:pointer;font-size:1.05rem;font-weight:600;color:var(--acc);padding:8px 0;display:flex;align-items:center;gap:8px">
                ${g.nick} <span style="color:var(--t2);font-weight:400;font-size:.85rem">(${g.indices.length})</span>
            </summary>
            ${g.indices.map(i => renderCard(sessions[i], i)).join("")}
        </details>`;
    } else {
        container.innerHTML = groups.map((g, gi) => {
            const isOpen = isGroupOpen(g.accountId);
            return `<details class="sess-group" data-acc-id="${g.accountId}"${isOpen ? " open" : ""} style="margin-bottom:12px">
                <summary style="cursor:pointer;font-size:1.05rem;font-weight:600;color:var(--acc);padding:8px 0;display:flex;align-items:center;gap:8px">
                    ${g.nick} <span style="color:var(--t2);font-weight:400;font-size:.85rem">(${g.indices.length})</span>
                    <span style="margin-left:auto;display:flex;gap:2px">
                        ${gi > 0 ? `<button class="btn btn-ghost btn-sm" onclick="event.preventDefault();moveAccountGroup('${g.accountId}',-1)" style="font-size:.7rem;padding:2px 6px">▲</button>` : ""}
                        ${gi < groups.length - 1 ? `<button class="btn btn-ghost btn-sm" onclick="event.preventDefault();moveAccountGroup('${g.accountId}',1)" style="font-size:.7rem;padding:2px 6px">▼</button>` : ""}
                    </span>
                </summary>
                ${g.indices.map(i => renderCard(sessions[i], i)).join("")}
            </details>`;
        }).join("");
    }

    container.querySelectorAll("details.sess-group").forEach(det => {
        det.addEventListener("toggle", () => {
            if (window._sessGroupSyncing) return;
            setSessGroupOpen(det.dataset.accId, det.open);
            if ($("sessGlobalSettings")?.classList.contains("open")) renderSessAccountOpenPrefs();
        });
    });
    if (globalSettingsWasOpen) {
        const panel = $("sessGlobalSettings");
        if (panel) panel.classList.add("open");
        renderSessAccountOpenPrefs();
    } else {
        renderSessAccountOpenPrefs();
    }

    // Attach sort click handlers to session table headers
    container.querySelectorAll("th.sortable[data-ssort]").forEach(th => {
        th.addEventListener("click", () => sortSessionColumn(+th.dataset.sessIdx, th.dataset.ssort));
    });
    container.querySelectorAll("[data-ar-idx][data-ar-field]").forEach(el => {
        el.addEventListener("change", () => {
            const idx = +el.getAttribute("data-ar-idx");
            const field = el.getAttribute("data-ar-field");
            const sessions = getSessions();
            const s = sessions[idx];
            if (!s) return;
            s.autoReset = _sessionAutoResetCfg(s);
            if (field === "enabled") s.autoReset.enabled = !!el.checked;
            else if (field === "period") s.autoReset.period = el.value;
            else if (field === "weekday") s.autoReset.weekday = +el.value || 1;
            else if (field === "monthday") s.autoReset.monthday = +el.value || 1;
            else if (field === "time") s.autoReset.time = el.value || "03:00";
            // Arm next scheduled run; do not fire immediately after toggle/edit.
            s.autoReset.lastRun = Date.now();
            saveSessions(sessions);
            renderSessions();
        });
    });

    // Drag & drop reordering
    let dragIdx = null;
    container.querySelectorAll(".sess-draggable").forEach(el => {
        el.addEventListener("dragstart", e => {
            dragIdx = +el.dataset.sess;
            el.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
        });
        el.addEventListener("dragend", () => {
            el.classList.remove("dragging");
            container.querySelectorAll(".sess-draggable").forEach(x => x.classList.remove("drag-over"));
            dragIdx = null;
        });
        el.addEventListener("dragover", e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            el.classList.add("drag-over");
        });
        el.addEventListener("dragleave", () => {
            el.classList.remove("drag-over");
        });
        el.addEventListener("drop", e => {
            e.preventDefault();
            el.classList.remove("drag-over");
            const dropIdx = +el.dataset.sess;
            if (dragIdx === null || dragIdx === dropIdx) return;
            const sessions = getSessions();
            const [moved] = sessions.splice(dragIdx, 1);
            sessions.splice(dropIdx, 0, moved);
            saveSessions(sessions);
            renderSessions();
        });
    });
}

function moveAccountGroup(accountId, dir) {
    const sessions = getSessions();
    // Build group order
    const order = [];
    const seen = new Set();
    sessions.forEach(s => {
        const key = String(s.accountId || "unknown");
        if (!seen.has(key)) { order.push(key); seen.add(key); }
    });
    const idx = order.indexOf(String(accountId));
    if (idx < 0) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= order.length) return;
    [order[idx], order[newIdx]] = [order[newIdx], order[idx]];
    // Re-sort sessions by new group order
    const sorted = [];
    order.forEach(accId => {
        sessions.forEach(s => { if (String(s.accountId || "unknown") === accId) sorted.push(s); });
    });
    saveSessions(sorted);
    renderSessions();
}

async function startSession() {
    if (!currentAccountId) { alert(t("findFirst")); return; }

    const name = $("sessionName").value.trim() || `${t("sessionDefault")} ${getSessions().length + 1}`;

    const [tanksData, tankInfo] = await Promise.all([ api("tanks/stats", { account_id: currentAccountId }), getTankInfo() ]);
    if (tanksData.status !== "ok") { alert(t("errorData")); return; }

    let tanks = tanksData.data[String(currentAccountId)] || [];
    enrichTanks(tanks, tankInfo);

    const sessions = getSessions();
    const nick = $("playerName").textContent || "???";
    sessions.unshift({ name, startTime: new Date().toISOString(), accountId: currentAccountId, accountNick: nick, tanks, diffs: [] });
    saveSessions(sessions);

    $("sessionName").value = "";
    renderSessions();
}

async function refreshSession(idx, opts = {}) {
    const sessions = getSessions();
    const sess = sessions[idx];
    if (!sess) return;

    const [tanksData, tankInfo] = await Promise.all([ api("tanks/stats", { account_id: sess.accountId }), getTankInfo() ]);
    if (tanksData.status !== "ok") { if (!opts.silent) alert(t("errorData")); return; }

    let cur = tanksData.data[String(sess.accountId)] || [];
    enrichTanks(cur, tankInfo);

    applySessionDiffs(sess, cur);
    sessions[idx] = sess;

    // ── Store refresh snapshot for timeline ──────────────────
    const diffs = sess.diffs || [];
    const tb = diffs.reduce((s, d) => s + d.battles, 0);
    const tw = diffs.reduce((s, d) => s + d.wins, 0);
    const td = diffs.reduce((s, d) => s + d.damage_dealt, 0);
    if (!sessions[idx].refreshHistory) sessions[idx].refreshHistory = [];
    const lastSnap = sessions[idx].refreshHistory.slice(-1)[0];
    if (tb > 0 && (!lastSnap || lastSnap.battles !== tb)) {
        sessions[idx].refreshHistory.push({
            t: Date.now(), battles: tb, wins: tw, damage: td,
            tankDiffs: diffs.map(d => ({
                tank_id: d.tank_id, tank_name: d.tank_name, tank_tier: d.tank_tier, tank_type: d.tank_type,
                tank_image: d.tank_image, is_premium: d.is_premium,
                battles: d.battles, wins: d.wins, damage_dealt: d.damage_dealt, frags: d.frags,
                survived: d.survived || 0, spotted: d.spotted || 0, hits: d.hits || 0, shots: d.shots || 0,
                damage_received: d.damage_received || 0
            }))
        });
        if (sessions[idx].refreshHistory.length > 50) sessions[idx].refreshHistory.shift();
    }

    saveSessions(sessions);
    if (!opts.skipRender) {
        applyAutoHideInactiveAccounts();
        renderSessions();
    }
}

function _sessBattlesNow(sess) {
    return (sess.diffs || []).reduce((s, d) => s + (d.battles || 0), 0);
}

function applyAutoHideInactiveAccounts(activeAccountIds) {
    if (localStorage.getItem("clstats_autohide_inactive") !== "1") return;
    const sessions = getSessions();
    if (!sessions.length) return;

    const allIds = [...new Set(sessions.map(s => String(s.accountId || "unknown")))];
    let active = new Set((activeAccountIds || []).map(String));

    if (!active.size && currentAccountId) active.add(String(currentAccountId));
    if (!active.size) return;

    allIds.forEach(id => setSessGroupOpen(id, active.has(id)));
}

function focusAccountGroupForPlayer(accountId) {
    if (!accountId || localStorage.getItem("clstats_autohide_inactive") !== "1") return;
    applyAutoHideInactiveAccounts([accountId]);
}

async function refreshAllSessions() {
    if (isRefreshing) return;
    isRefreshing = true;
    try {
        const sessions = getSessions();
        const before = sessions.map(s => ({ acc: String(s.accountId || "unknown"), b: _sessBattlesNow(s) }));
        for (let i = 0; i < sessions.length; i++) {
            await refreshSession(i, { skipRender: true, silent: true });
        }
        const after = getSessions();
        const gained = new Set();
        after.forEach((s, i) => {
            const prev = before[i];
            if (!prev) return;
            if (_sessBattlesNow(s) > prev.b) gained.add(String(s.accountId || "unknown"));
        });
        if (gained.size) applyAutoHideInactiveAccounts([...gained]);
        else if (currentAccountId) applyAutoHideInactiveAccounts([currentAccountId]);
        renderSessions();
    } catch (e) {
        console.error("Auto-refresh error:", e);
        renderSessions();
    }
    isRefreshing = false;
}

function buildSessionDiffs(baselineTanks, curTanks) {
    const oldMap = {};
    (baselineTanks || []).forEach(tk => { oldMap[tk.tank_id] = tk; });

    const diffs = [];
    (curTanks || []).forEach(tk => {
        if (!tk.all) return;
        const old = oldMap[tk.tank_id];
        const oa = old && old.all ? old.all : wgDefaultAll();
        const bd = (tk.all.battles || 0) - (oa.battles || 0);
        if (bd > 0) {
            const newMaxFrags = tk.all.max_frags || 0, oldMaxFrags = oa.max_frags || 0;
            const newMaxXp = tk.all.max_xp || 0, oldMaxXp = oa.max_xp || 0;
            diffs.push({
                tank_id: tk.tank_id,
                tank_name: tk.tank_name, tank_tier: tk.tank_tier, tank_type: tk.tank_type,
                tank_image: tk.tank_image, is_premium: tk.is_premium,
                battles: bd, wins: (tk.all.wins || 0) - (oa.wins || 0),
                damage_dealt: (tk.all.damage_dealt || 0) - (oa.damage_dealt || 0),
                frags: (tk.all.frags || 0) - (oa.frags || 0),
                survived: (tk.all.survived_battles || 0) - (oa.survived_battles || 0),
                spotted: wgDiffField(tk.all, oa, "spotted"),
                hits: wgDiffField(tk.all, oa, "hits"),
                shots: wgDiffField(tk.all, oa, "shots"),
                damage_received: wgDiffField(tk.all, oa, "damage_received"),
                max_frags: newMaxFrags > oldMaxFrags ? newMaxFrags : 0,
                max_xp: newMaxXp > oldMaxXp ? newMaxXp : 0
            });
        }
    });
    return { diffs, oldMap };
}

function computeSessPerf(diffs, oldMap) {
    let perfNumer = 0, perfDenom = 0;
    diffs.forEach(d => {
        if (d.battles < 2 || !d.tank_id) return;
        const old = oldMap[d.tank_id];
        if (!old || !old.all) return;
        const ob = old.all.battles || 0;
        if (ob < 10) return;
        const overallWR = old.all.wins / ob * 100;
        if (overallWR < 3 || overallWR > 97) return;
        const sessWR = d.wins / d.battles * 100;
        const w = Math.min(d.battles, 10);
        perfNumer += (sessWR - overallWR) * w;
        perfDenom += w;
    });
    return perfDenom >= 4 ? Math.round(perfNumer / perfDenom * 10) / 10 : null;
}

function applySessionDiffs(sess, curTanks) {
    const { diffs, oldMap } = buildSessionDiffs(sess.tanks, curTanks);
    sess.diffs = diffs;
    sess.sessPerf = computeSessPerf(diffs, oldMap);
    if (!sess.isPrimary) updateSessionAdviceBlocks(sess);
}

function sessionDiffsNeedExtraFields(diffs) {
    return (diffs || []).some(d => d.battles > 0 && d.spotted === undefined);
}

function syncAccountSessions(accountId, curTanks, opts = {}) {
    if (!accountId || !curTanks?.length) return false;
    const sessions = getSessions();
    let changed = false;
    sessions.forEach(sess => {
        if (String(sess.accountId) !== String(accountId) || !sess.tanks?.length) return;
        const prev = sess.diffs || [];
        if (!sessionDiffsNeedExtraFields(prev) && prev.length > 0) {
            const tb = prev.reduce((s, d) => s + d.battles, 0);
            const { diffs } = buildSessionDiffs(sess.tanks, curTanks);
            const nb = diffs.reduce((s, d) => s + d.battles, 0);
            if (tb === nb) return;
        }
        applySessionDiffs(sess, curTanks);
        changed = true;
    });
    if (changed) {
        saveSessions(sessions);
        if (opts.render !== false) renderSessions();
    }
    return changed;
}

// Session sort state per index
const sessionSortState = {};

function getSessionSort(idx) {
    if (!sessionSortState[idx]) sessionSortState[idx] = { field: "battles", dir: "desc" };
    return sessionSortState[idx];
}

function sortSessionColumn(idx, field) {
    const state = getSessionSort(idx);
    if (state.field === field) {
        state.dir = state.dir === "desc" ? "asc" : "desc";
    } else {
        state.field = field;
        state.dir = "desc";
    }
    // Update header classes
    const container = document.querySelector(`[data-sess="${idx}"]`);
    if (container) {
        container.querySelectorAll("th.sortable").forEach(th => {
            th.classList.remove("sort-asc", "sort-desc");
            if (th.dataset.ssort === field) th.classList.add(state.dir === "asc" ? "sort-asc" : "sort-desc");
        });
    }
    // Re-render rows
    const sessions = getSessions();
    const diffs = sessions[idx]?.diffs || [];
    const tbody = document.getElementById(`sess-tbody-${idx}`);
    if (tbody) tbody.innerHTML = renderSessionRows(diffs, state.field, state.dir);
}

function renderSessionRows(diffs, sortField, sortDir) {
    const sorted = [...diffs].sort((a, b) => {
        let va, vb;
        switch (sortField) {
            case "name": va = (a.tank_name||"").toLowerCase(); vb = (b.tank_name||"").toLowerCase(); break;
            case "tier": va = a.tank_tier||0; vb = b.tank_tier||0; break;
            case "type": va = a.tank_type||""; vb = b.tank_type||""; break;
            case "battles": va = a.battles; vb = b.battles; break;
            case "wins": va = a.wins; vb = b.wins; break;
            case "winrate": va = a.battles>0 ? a.wins/a.battles : 0; vb = b.battles>0 ? b.wins/b.battles : 0; break;
            case "avg_dmg": va = a.battles>0 ? a.damage_dealt/a.battles : 0; vb = b.battles>0 ? b.damage_dealt/b.battles : 0; break;
            case "avg_frags": va = a.battles>0 ? a.frags/a.battles : 0; vb = b.battles>0 ? b.frags/b.battles : 0; break;
            case "avg_spot": va = a.battles>0 ? (a.spotted||0)/a.battles : 0; vb = b.battles>0 ? (b.spotted||0)/b.battles : 0; break;
            case "accuracy": va = a.shots>0 ? a.hits/a.shots : 0; vb = b.shots>0 ? b.hits/b.shots : 0; break;
            default: va = a.battles; vb = b.battles;
        }
        let cmp = typeof va === "string" ? va.localeCompare(vb) : va - vb;
        return sortDir === "desc" ? -cmp : cmp;
    });
    return sorted.map(d => {
        const dwr = d.battles > 0 ? (d.wins / d.battles * 100) : 0;
        const davg = d.battles > 0 ? Math.round(d.damage_dealt / d.battles) : 0;
        const dspot = d.battles > 0 ? ((d.spotted || 0) / d.battles).toFixed(1) : "—";
        const dacc = fmtAccPct(d.hits, d.shots);
        const nc = d.is_premium ? "premium" : "";
        const img = d.tank_image ? `<img src="${d.tank_image}" alt="" loading="lazy">` : "";
        return `<tr>
            <td><div class="tank-name-cell">${img}<span class="${nc}">${resolveStoredTankName(d)}</span></div></td>
            <td>${TIER_ROMAN[d.tank_tier] || d.tank_tier}</td>
            <td>${t(TYPE_KEY[d.tank_type] || "") || "?"}</td>
            <td>${d.battles}</td><td>${d.wins}</td>
            <td class="${getWrClass(dwr)}">${dwr.toFixed(1)}%</td>
            <td>${davg.toLocaleString()}</td>
            <td>${d.battles > 0 ? (d.frags / d.battles).toFixed(2) : "0"}</td>
            <td>${dspot}</td>
            <td>${dacc}</td>
        </tr>`;
    }).join("");
}

// ==================== SESSION ARCHIVE ====================
function getArchive() { return JSON.parse(localStorage.getItem("clstats_archive") || "[]"); }
function saveArchive(a) { localStorage.setItem("clstats_archive", JSON.stringify(a)); }

let autoResetTimer = null;
let isAutoResetRunning = false;
function _parseHM(v) {
    const m = /^(\d{2}):(\d{2})$/.exec(String(v || ""));
    if (!m) return { h: 3, m: 0 };
    return { h: Math.max(0, Math.min(23, +m[1])), m: Math.max(0, Math.min(59, +m[2])) };
}
function _monthDays(y, mo) { return new Date(y, mo + 1, 0).getDate(); }
function _slotStart(now, cfg) {
    const { h, m } = _parseHM(cfg.time);
    if (cfg.period === "daily") {
        const t = new Date(now);
        t.setHours(h, m, 0, 0);
        if (t > now) t.setDate(t.getDate() - 1);
        return t;
    }
    if (cfg.period === "weekly") {
        const targetJsDow = cfg.weekday % 7;
        const t = new Date(now);
        t.setHours(h, m, 0, 0);
        const curDow = t.getDay();
        let diff = curDow - targetJsDow;
        if (diff < 0) diff += 7;
        t.setDate(t.getDate() - diff);
        if (t > now) t.setDate(t.getDate() - 7);
        return t;
    }
    const y = now.getFullYear();
    const mo = now.getMonth();
    const d = Math.min(cfg.monthday, _monthDays(y, mo));
    let t = new Date(y, mo, d, h, m, 0, 0);
    if (t > now) {
        const py = mo === 0 ? y - 1 : y;
        const pmo = mo === 0 ? 11 : mo - 1;
        const pd = Math.min(cfg.monthday, _monthDays(py, pmo));
        t = new Date(py, pmo, pd, h, m, 0, 0);
    }
    return t;
}
function _nextRun(now, cfg) {
    const prev = _slotStart(now, cfg);
    if (cfg.period === "daily") return new Date(prev.getTime() + 24 * 3600 * 1000);
    if (cfg.period === "weekly") return new Date(prev.getTime() + 7 * 24 * 3600 * 1000);
    const y = prev.getFullYear(), mo = prev.getMonth();
    const ny = mo === 11 ? y + 1 : y;
    const nmo = mo === 11 ? 0 : mo + 1;
    const nd = Math.min(cfg.monthday, _monthDays(ny, nmo));
    const { h, m } = _parseHM(cfg.time);
    return new Date(ny, nmo, nd, h, m, 0, 0);
}
function refreshAutoResetStatus() {
    // Per-session status is rendered inside each session card.
}
async function _maybeAutoResetTick() {
    if (isAutoResetRunning) return;
    const sessions = getSessions();
    if (!sessions.length) return;
    isAutoResetRunning = true;
    let anyReset = false;
    try {
        const now = new Date();
        for (let i = 0; i < sessions.length; i++) {
            const cur = getSessions();
            const s = cur[i];
            if (!s) continue;
            const cfg = _sessionAutoResetCfg(s);
            if (!cfg.enabled) continue;
            const slot = _slotStart(now, cfg).getTime();
            if (Date.now() < slot || Number(cfg.lastRun || 0) >= slot) continue;
            await resetSession(i, { skipRender: true, silent: true });
            const after = getSessions();
            if (!after[i]) continue;
            after[i].autoReset = _sessionAutoResetCfg(after[i]);
            after[i].autoReset.lastRun = Date.now();
            saveSessions(after);
            anyReset = true;
            console.log("[CL-Stats] " + t("sessAutoResetDone") + ` (#${i + 1})`);
        }
    } finally {
        isAutoResetRunning = false;
        if (anyReset) renderSessions();
    }
}
function setupAutoReset() {
    _setupAutoResetTimer();
    _maybeAutoResetTick();
}
function _setupAutoResetTimer() {
    if (autoResetTimer) { clearInterval(autoResetTimer); autoResetTimer = null; }
    autoResetTimer = setInterval(() => { _maybeAutoResetTick(); }, 60 * 1000);
}

function archiveSession(idx) {
    const sessions = getSessions();
    const sess = sessions[idx];
    if (!sess) return;
    const archive = getArchive();
    const diffs = sess.diffs || [];
    const tb = diffs.reduce((s, d) => s + d.battles, 0);
    if (tb === 0) return;
    archive.unshift({
        name: sess.name,
        startTime: sess.startTime,
        archivedTime: Date.now(),
        accountId: sess.accountId,
        battles: tb,
        wins: diffs.reduce((s, d) => s + d.wins, 0),
        damage: diffs.reduce((s, d) => s + d.damage_dealt, 0),
        frags: diffs.reduce((s, d) => s + d.frags, 0),
        tanksCount: diffs.length,
        baseTanks: sess.tanks,
        diffs: diffs
    });
    saveArchive(archive);
    sessions.splice(idx, 1);
    saveSessions(sessions);
    renderSessions();
    renderArchive();
}

function restoreArchive(idx) {
    const archive = getArchive();
    const a = archive[idx];
    if (!a) return;
    const sessions = getSessions();
    sessions.push({ name: a.name, startTime: a.startTime, accountId: a.accountId || currentAccountId, tanks: a.baseTanks || [], diffs: a.diffs || [] });
    saveSessions(sessions);
    archive.splice(idx, 1);
    saveArchive(archive);
    renderSessions();
    renderArchive();
}

function deleteArchive(idx) {
    if (!confirm(t("confirmStop"))) return;
    const archive = getArchive();
    archive.splice(idx, 1);
    saveArchive(archive);
    renderArchive();
}

function clearArchive() {
    if (!confirm(t("confirmStop"))) return;
    saveArchive([]);
    renderArchive();
}

        return `<div class="tanks-section" style="margin-bottom:10px;padding:10px">

                <span>${t("sessAvgDmg")}: <b>${avgDmg.toLocaleString()}</b></span>
                <span>${t("sessAvgFrags")}: <b>${a.battles > 0 ? (a.frags/a.battles).toFixed(2) : "0"}</b></span>

// ==================== EXPORT / IMPORT ====================
function exportData() {
    const data = {
        clstats_version: 1,
        exported: new Date().toISOString(),
        player: localStorage.getItem("clstats_player"),
        profiles: localStorage.getItem("clstats_profiles"),
        sessions: localStorage.getItem("clstats_sessions"),
        archive: localStorage.getItem("clstats_archive"),
        theme: localStorage.getItem("clstats_theme"),
        lang: localStorage.getItem("clstats_lang")
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `blitzstats-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}

function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const data = JSON.parse(reader.result);
            if (data.player) localStorage.setItem("clstats_player", data.player);
            if (data.profiles) localStorage.setItem("clstats_profiles", data.profiles);
            if (data.sessions) localStorage.setItem("clstats_sessions", data.sessions);
            if (data.archive) localStorage.setItem("clstats_archive", data.archive);
            if (data.theme) localStorage.setItem("clstats_theme", data.theme);
            if (data.lang) localStorage.setItem("clstats_lang", data.lang);
            alert(t("importSuccess"));
            location.reload();
        } catch (err) {
            alert(t("importError"));
        }
    };
    reader.readAsText(file);
    e.target.value = "";
}
