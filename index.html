<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CL-Stats</title>
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0a0e17;--bg2:#161b28;--bg3:#1a2030;--bg-in:#141824;--bg-dd:#1a1f2e;
            --brd:#252a3a;--brd2:#2a2f3e;--t1:#e0e0e0;--t2:#888;--t3:#ccc;--tv:#fff;
            --acc:#f5a623;--acc2:#e8852a;--hover:#1e2438;
        }
        [data-theme="light"]{
            --bg:#f0f2f5;--bg2:#fff;--bg3:#f8f9fa;--bg-in:#fff;--bg-dd:#fff;
            --brd:#dde1e6;--brd2:#c0c5cc;--t1:#1a1a2e;--t2:#666;--t3:#333;--tv:#111;
            --acc:#e8852a;--acc2:#d4700a;--hover:#f0f4ff;
        }
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;transition:background .3s,color .3s}
        .container{max-width:1200px;margin:0 auto;padding:15px}

        /* Header */
        header{text-align:center;padding:20px 0 10px;position:relative}
        header h1{font-size:2.2rem;background:linear-gradient(135deg,#f5a623,#e8852a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .subtitle{color:var(--t2);margin-top:4px;font-size:.9rem}

        /* Top controls */
        .top-controls{display:flex;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
        .top-btn{background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--t2);transition:all .2s;display:flex;align-items:center;gap:4px}
        .top-btn:hover{border-color:var(--acc);color:var(--t1)}
        .lang-select{background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:5px 10px;color:var(--t1);font-size:.85rem;cursor:pointer;outline:none}
        .lang-select:focus{border-color:var(--acc)}

        /* Search */
        .search-box{display:flex;justify-content:center;gap:8px;margin:15px auto;position:relative;max-width:500px}
        .search-box input{flex:1;padding:11px 16px;border:2px solid var(--brd);border-radius:8px;background:var(--bg-in);color:var(--t1);font-size:1rem;outline:none;transition:border-color .2s}
        .search-box input:focus{border-color:var(--acc)}
        .btn{padding:10px 22px;background:linear-gradient(135deg,#f5a623,#e8852a);border:none;border-radius:8px;color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .2s}
        .btn:hover{opacity:.85}
        .btn-sm{padding:6px 14px;font-size:.85rem;border-radius:6px}
        .btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b)!important}
        .btn-secondary{background:linear-gradient(135deg,#5cc9e8,#3498db)!important}
        .btn-ghost{background:transparent;border:1px solid var(--brd);color:var(--t2)}
        .btn-ghost:hover{border-color:var(--acc);color:var(--t1)}

        .search-results{position:absolute;top:100%;left:0;right:0;background:var(--bg-dd);border:1px solid var(--brd);border-radius:8px;margin-top:4px;z-index:100;max-height:280px;overflow-y:auto}
        .result-item{padding:10px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
        .result-item:last-child{border-bottom:none}
        .result-item:hover{background:var(--hover)}
        .result-item .nickname{font-weight:600;color:var(--acc)}
        .result-item .account-id{font-size:.8rem;color:var(--t2)}
        .result-item .save-icon{font-size:1.1rem;cursor:pointer;padding:2px 6px;opacity:.5;transition:opacity .2s}
        .result-item .save-icon:hover,.result-item .save-icon.saved{opacity:1;color:var(--acc)}

        .hidden{display:none!important}

        /* Saved profiles */
        .profiles-section{margin:10px auto 14px;max-width:960px;width:100%;text-align:center}
        .profiles-title{font-size:.85rem;color:var(--t2);margin-bottom:8px}
        .profiles-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
        .profile-chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--t1);transition:all .2s;white-space:nowrap}
        .profile-chip:hover{border-color:var(--acc)}
        .profile-chip.dragging{opacity:.45;border-style:dashed}
        .profile-chip.drag-over{border-color:var(--acc);box-shadow:0 0 8px rgba(245,166,35,.25)}
        .profile-drag{cursor:grab;font-size:.95rem;color:var(--t2);user-select:none;line-height:1;padding:0 2px}
        .profile-drag:hover{color:var(--acc)}
        .profile-chip .remove{font-size:.75rem;color:var(--t2);margin-left:2px;cursor:pointer}
        .profile-chip .remove:hover{color:#e74c3c}

        /* Compare */
        .compare-players-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:end}
        .compare-players-row > div{flex:1;min-width:150px}
        .cmp-profile-quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:center}
        .cmp-profile-quick .quick-chip{padding:4px 10px;font-size:.78rem;border-radius:16px;background:var(--bg3);border:1px solid var(--brd);color:var(--t1);cursor:pointer;transition:all .15s}
        .cmp-profile-quick .quick-chip:hover{border-color:var(--acc);color:var(--acc)}
        .compare-section{margin-top:18px;padding-top:16px;border-top:1px solid var(--brd)}
        .compare-section h3{color:var(--acc);font-size:.95rem;margin-bottom:6px}
        .cmp-tank-meta{font-size:.8rem;color:var(--t2);margin-bottom:10px}
        .cmp-tank-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
        .cmp-tank-filters select,.cmp-tank-filters input{padding:7px 10px;border:1px solid var(--brd);border-radius:6px;background:var(--bg-in);color:var(--t1);font-size:.85rem;outline:none}
        .cmp-tank-filters select:focus,.cmp-tank-filters input:focus{border-color:var(--acc)}
        .cmp-tank-filters input{min-width:140px;flex:1}
        .cmp-tank-filters select#cmpTankSelect{min-width:220px;flex:2;max-width:100%}
        .compare-table td,.compare-table th{text-align:center}
        .compare-table td:first-child,.compare-table th:first-child{text-align:left}

        /* Player */
        .player-header{text-align:center;margin:15px 0 20px}
        .player-header h2{font-size:1.6rem;color:var(--acc);display:inline}
        .last-battle{display:block;color:var(--t2);font-size:.82rem;margin-top:4px}

        /* Tabs */
        .tabs{display:flex;justify-content:center;gap:4px;margin:15px 0;flex-wrap:wrap}
        .tab-btn{padding:9px 20px;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;color:var(--t2);font-size:.9rem;cursor:pointer;transition:all .2s}
        .tab-btn:hover{border-color:var(--acc);color:var(--t1)}
        .tab-btn.active{background:linear-gradient(135deg,#f5a623,#e8852a);color:#fff;border-color:transparent;font-weight:600}
        .tab-content{display:none}.tab-content.active{display:block}

        /* Stats */
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:25px}
        .stat-card{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;padding:16px;text-align:center;transition:transform .2s,border-color .2s}
        .stat-card:hover{transform:translateY(-2px);border-color:#f5a62355}
        .stat-value{font-size:1.4rem;font-weight:700;color:var(--tv)}
        .stat-label{font-size:.8rem;color:var(--t2);margin-top:4px;text-transform:uppercase}

        /* Charts */
        .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px}
        .chart-container{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;padding:15px}
        .chart-container h3{color:var(--t3);margin-bottom:10px;font-size:.95rem}

        /* Tables */
        .tanks-section{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;padding:15px}
        .tanks-section h3{color:var(--t3);margin-bottom:12px}
        .tank-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
        .tank-filters select{padding:7px 10px;background:var(--bg3);border:1px solid var(--brd);border-radius:6px;color:var(--t1);font-size:.85rem;outline:none;cursor:pointer}
        .tank-filters select:focus{border-color:var(--acc)}

        .table-wrap{max-height:600px;overflow-y:auto;-webkit-overflow-scrolling:touch}
        table{width:100%;border-collapse:collapse}
        thead{position:sticky;top:0;z-index:10}
        th{background:var(--bg3);color:var(--acc);padding:9px 10px;text-align:left;font-weight:600;font-size:.82rem;border-bottom:2px solid #f5a62333}
        th.sortable{cursor:pointer;user-select:none;transition:color .2s}
        th.sortable:hover{color:#fff}
        th.sortable::after{content:'';margin-left:4px;font-size:.7rem;opacity:.4}
        th.sort-asc::after{content:'\25B2';opacity:1}
        th.sort-desc::after{content:'\25BC';opacity:1}
        td{padding:9px 10px;border-bottom:1px solid var(--brd);font-size:.85rem}
        tbody tr:hover{background:var(--hover)}

        .tank-name-cell{display:flex;align-items:center;gap:6px}
        .tank-name-cell img{width:36px;height:auto;border-radius:3px}
        .premium{color:var(--acc);font-weight:600}

        .wr-avg{color:#999}.wr-good{color:#7ecb54}.wr-great{color:#5cc9e8}.wr-unicum{color:#b36ce8}

        /* Session */
        .session-controls{display:flex;gap:8px;align-items:center;margin-bottom:15px;flex-wrap:wrap}
        .session-info{color:var(--t2);font-size:.82rem;padding:6px 12px;background:var(--bg2);border:1px solid var(--brd);border-radius:8px}
        .session-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:15px}
        /* Modal */
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);z-index:1000;overflow-y:auto;padding:20px 12px}
        .modal-box{max-width:720px;margin:40px auto;background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:22px 20px;position:relative}
        .modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--t2);font-size:1.5rem;cursor:pointer;line-height:1;transition:color .15s}
        .modal-close:hover{color:var(--t1)}
        .session-stat-card{background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:8px 4px;text-align:center}
        .session-stat-card .stat-value{font-size:1.1rem}
        .drag-handle{cursor:grab;font-size:1.2rem;color:var(--t2);user-select:none;transition:color .2s}
        .drag-handle:hover{color:var(--acc)}
        .sess-draggable.dragging{opacity:.4;border-style:dashed}
        .sess-draggable.drag-over{border-color:var(--acc);box-shadow:0 0 10px rgba(245,166,35,.3)}
        .sess-advice{margin-bottom:12px}
        .sess-advice-item{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:8px;font-size:.82rem;line-height:1.45;border:1px solid var(--brd);margin-bottom:6px;background:var(--bg3)}
        .sess-advice-warn{border-color:#e74c3c66;background:rgba(231,76,60,.06)}
        .sess-advice-tip{border-color:#f5a62366;background:rgba(245,166,35,.06)}
        .sess-advice-hint{border-color:#5cc9e866;background:rgba(92,201,232,.05)}
        .sess-settings-panel{display:none;flex-direction:column;gap:10px;margin:0 0 12px;padding:12px;border:1px solid var(--brd);border-radius:10px;background:var(--bg3)}
        .sess-settings-panel.open{display:flex}
        .sess-settings-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
        .sess-settings-row .btn{white-space:nowrap}
        .sess-settings-divider{height:1px;background:var(--brd);margin:2px 0}
        .sess-global-settings{display:none;margin:0 0 12px;padding:12px;border:1px solid var(--brd);border-radius:10px;background:var(--bg3)}
        .sess-global-settings.open{display:block}
        .sess-global-settings label{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--t2);cursor:pointer;margin:4px 0}
        .sess-gear-btn{min-width:32px;font-size:1rem;line-height:1}
        #helpContent h4{color:var(--acc);margin:18px 0 6px;font-size:.95rem}
        #helpContent h4:first-child{margin-top:0}
        #helpContent p{color:var(--t1);font-size:.88rem;margin-bottom:8px}
        #helpContent ol{margin:6px 0 10px 20px;font-size:.88rem;color:var(--t1)}
        #helpContent li{margin-bottom:4px}
        .no-session{text-align:center;padding:50px 20px;color:var(--t2)}
        .no-session p{margin-bottom:12px;font-size:.95rem}

        /* Loading */
        .loading{text-align:center;padding:30px;color:var(--t2)}
        .loading::after{content:'';display:inline-block;width:18px;height:18px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-left:8px;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}

        ::-webkit-scrollbar{width:7px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
        ::-webkit-scrollbar-thumb:hover{background:var(--brd2)}

        @media(max-width:768px){
            .stats-grid,.session-stats-grid{grid-template-columns:repeat(2,1fr)}
            .charts-row{grid-template-columns:1fr}
            header h1{font-size:1.8rem}
            .stat-value{font-size:1.2rem}
            td,th{padding:7px 6px;font-size:.78rem}
            .tank-name-cell img{width:28px}
        }
        @media(max-width:400px){
            .stats-grid,.session-stats-grid{grid-template-columns:1fr 1fr}
            .container{padding:10px}
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CL-Stats</h1>
            <p class="subtitle" data-i18n="subtitle"></p>
        </header>

        <div class="top-controls">
            <button class="top-btn" id="themeToggle"><span id="themeIcon">&#9790;</span></button>
            <select class="lang-select" id="langSelect">
                <option value="uk">UA Українська</option>
                <option value="ru">RU Русский</option>
                <option value="en">EN English</option>
                <option value="uz">UZ O'zbekcha</option>
            </select>
            <button class="top-btn" onclick="exportData()" data-i18n="exportBtn"></button>
            <button class="top-btn" onclick="document.getElementById('importFile').click()" data-i18n="importBtn"></button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
            <button class="btn" id="searchBtn" data-i18n="searchBtn"></button>
            <div id="searchResults" class="search-results hidden"></div>
        </div>

        <!-- Saved Profiles -->
        <div class="profiles-section" id="profilesSection">
            <div class="profiles-title" data-i18n="savedProfiles"></div>
            <div class="profiles-list" id="profilesList"></div>
        </div>

        <!-- Player Section -->
        <div id="playerSection" class="hidden">
            <div class="player-header">
                <h2 id="playerName"></h2>
                <span id="lastBattle" class="last-battle"></span>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="overview" data-i18n="tabOverview"></button>
                <button class="tab-btn" data-tab="tanks" data-i18n="tabTanks"></button>
                <button class="tab-btn" data-tab="session" data-i18n="tabSession"></button>
                <button class="tab-btn" data-tab="compare" data-i18n="tabCompare"></button>
                <button class="tab-btn" data-tab="help" data-i18n="tabHelp"></button>
            </div>

            <!-- Overview -->
            <div class="tab-content active" id="tab-overview">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-value" id="statBattles">—</div><div class="stat-label" data-i18n="battles"></div></div>
                    <div class="stat-card"><div class="stat-value" id="statWinrate">—</div><div class="stat-label" data-i18n="winrate"></div></div>
                    <div class="stat-card"><div id="statWinsFor1Pct" style="display:flex;align-items:center;justify-content:center;gap:6px"><span class="stat-value">—</span></div><div id="statWinsLabel" class="stat-label" data-i18n="winsFor1Pct"></div></div>
                    <div class="stat-card"><div class="stat-value" id="statAvgDmg">—</div><div class="stat-label" data-i18n="avgDmg"></div></div>
                    <div class="stat-card"><div class="stat-value" id="statSurvival">—</div><div class="stat-label" data-i18n="survival"></div></div>
                    <div class="stat-card"><div class="stat-value" id="statAccuracy">—</div><div class="stat-label" data-i18n="accuracy"></div></div>
                    <div class="stat-card"><div class="stat-value" id="statAvgSpot">—</div><div class="stat-label" data-i18n="avgSpot"></div></div>
                    <div class="stat-card"><div class="stat-value" id="statAvgFrags">—</div><div class="stat-label" data-i18n="avgFrags"></div></div>
                    <div class="stat-card"><div class="stat-value" id="statMaxFrags">—</div><div class="stat-label" data-i18n="maxFrags"></div></div>
                </div>
                <div class="charts-row">
                    <div class="chart-container"><h3 data-i18n="chartBattles"></h3><canvas id="battlesChart"></canvas></div>
                    <div class="chart-container"><h3 data-i18n="chartTypes"></h3><canvas id="tankTypesChart"></canvas></div>
                </div>
                <div class="charts-row">
                    <div class="chart-container"><h3 data-i18n="chartNations"></h3><canvas id="nationsChart"></canvas></div>
                    <div class="chart-container"><h3 data-i18n="chartTiers"></h3><canvas id="tiersChart"></canvas></div>
                </div>
            </div>

            <!-- Tanks -->
            <div class="tab-content" id="tab-tanks">
                <!-- Sub-tabs -->
                <div style="display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--brd)">
                    <button id="tankSubListBtn" onclick="switchTanksTab('list')"
                        style="padding:8px 20px;background:none;border:none;border-bottom:2px solid var(--acc);margin-bottom:-2px;color:var(--acc);font-weight:600;font-size:.9rem;cursor:pointer">
                        🔫 <span data-i18n="tabTanks"></span>
                    </button>
                    <button id="tankSubRatingBtn" onclick="switchTanksTab('rating')"
                        style="padding:8px 20px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--t2);font-size:.9rem;cursor:pointer">
                        🏆 <span data-i18n="tabRating"></span>
                    </button>
                </div>

                <!-- Tank list -->
                <div id="tanksSubList">
                    <div class="tanks-section">
                        <div class="tank-filters">
                            <input type="text" id="tankSearch" data-i18n-placeholder="tankSearchPlaceholder" style="padding:6px 10px;border-radius:8px;border:1px solid var(--brd);background:var(--bg-in);color:var(--t1);font-size:.85rem;width:160px">
                            <select id="tierFilter"><option value="" data-i18n="allTiers"></option></select>
                            <select id="typeFilter"><option value="" data-i18n="allTypes"></option></select>
                            <select id="sortFilter"></select>
                            <label style="display:flex;align-items:center;gap:4px;font-size:.85rem;color:var(--t2);cursor:pointer">
                                <input type="checkbox" id="hideRemoved" checked> <span data-i18n="hideRemoved"></span>
                            </label>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead><tr>
                                    <th class="sortable" data-sort="name" data-i18n="thTank"></th>
                                    <th class="sortable" data-sort="tier" data-i18n="thTier"></th>
                                    <th class="sortable" data-sort="type" data-i18n="thType"></th>
                                    <th class="sortable sort-desc" data-sort="battles" data-i18n="battles"></th>
                                    <th class="sortable" data-sort="winrate" data-i18n="winrate"></th>
                                    <th class="sortable" data-sort="avg_dmg" data-i18n="avgDmg"></th>
                                    <th class="sortable" data-sort="avg_frags" data-i18n="avgFrags"></th>
                                    <th class="sortable" data-sort="avg_spot" data-i18n="avgSpot"></th>
                                    <th class="sortable" data-sort="accuracy" data-i18n="accuracy"></th>
                                    <th class="sortable" data-sort="max_xp" data-i18n="maxXP"></th>
                                    <th class="sortable" data-sort="wins_for_1pct" data-i18n="winsFor1Pct"></th>
                                </tr></thead>
                                <tbody id="tankTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Rating -->
                <div id="tanksSubRating" style="display:none">
                    <div class="tanks-section">
                        <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
                            <label style="color:var(--t2);font-size:.85rem" data-i18n="ratingMinBattles"></label>
                            <input type="number" id="ratingMinBattles" value="20" min="1" max="500" style="width:70px;padding:5px 8px;border:1px solid var(--brd);border-radius:6px;background:var(--bg-in);color:var(--t1);font-size:.85rem;outline:none">
                            <select id="ratingTierFilter" style="padding:5px 8px;border:1px solid var(--brd);border-radius:6px;background:var(--bg-in);color:var(--t1);font-size:.85rem">

        helpTitle:"Як користуватися CL-Stats",
        helpContent:`<h4>🔍 Пошук гравця</h4>
<p>Введіть нікнейм у поле пошуку та натисніть «Пошук». Оберіть гравця зі списку результатів. Нікнейм зберігається автоматично. Дані кешуються на 15 хвилин.</p>

<h4>⭐ Збережені профілі</h4>
<p>Натисніть зірочку (★) поруч з ніком у результатах пошуку, щоб зберегти профіль. Збережені профілі відображаються під пошуком — один клік і статистика завантажується. Щоб видалити — натисніть × на профілі.</p>

<h4>📊 Вкладка «Загальна»</h4>
<p>Загальна статистика акаунту: бої, вінрейт, середня шкода, фраги, виживання, влучність, засвіт та макс. фраги. Поле «Боїв до» показує скільки перемог потрібно до наступного цілого відсотка та до +1% вінрейту. Графіки: розподіл боїв, типи танків, нації та рівні.</p>
<p style="color:var(--t2);font-size:.85rem"><b>Примітка:</b> асист і блок через WG API недоступні — лише у desktop-версії з реплеїв.</p>

<h4>🔫 Вкладка «Танки»</h4>
<p>Детальна статистика по кожному танку. Фільтри за рівнем, типом та пошук за назвою. Сортування — натисніть на заголовок стовпця (▲/▼).</p>
<p><b>Деталі танку:</b> натисніть на будь-який рядок у таблиці — відкриється вікно з повною статистикою танку та його історією по сесіях.</p>

<h4>🎮 Вкладка «Сесія»</h4>
<p>Відстежуйте результати за ігрову сесію:</p>
<ol>
<li>Натисніть <b>«Нова сесія»</b> перед початком гри (можна вказати назву)</li>
<li>Зіграйте кілька боїв</li>
<li>Натисніть <b>«Оновити всі»</b> — побачите статистику за цю сесію</li>
</ol>
<p>Можна мати декілька сесій одночасно. Сесії групуються по акаунтах — порядок груп ▲/▼. Перетягуйте сесії за ☰. Стан розгортання груп акаунтів запам’ятовується (напр. Hunter відкритий, інші згорнуті).</p>
<p><b>Шестерня ⚙ біля «Оновити всі»:</b> авторозгортання танків, автооновлення та які акаунти тримати відкритими.</p>
<p><b>Шестерня на картці сесії:</b> перейменувати, основна (ALL) сесія, автоскидання, в архів, видалити. Зовні лишається лише <b>«Скинути»</b>.</p>
<p><b>Основна сесія (ALL):</b> одна на акаунт — для загальної статистики. На ній попередження не показуються (лише Day/Week). Позначити можна в шестерні картки.</p>
<p><b>Попередження:</b> лише слабкі танки/класи за останні бої, з кулдауном ~10 боїв на інших. При частій ротації танків — попередження по класу.</p>
<p><b>Автоскидання:</b> щодня / щотижня / щомісяця + час — у шестерні сесії. Бейдж <b>AUTO ...</b> біля назви, якщо увімкнено.</p>
<p><b>VS СЕРЕДНЄ:</b> наскільки вінрейт сесії відрізняється від вашої норми на цих танках.</p>
<p><b>Кращий/Гірший танк:</b> натисніть картку — повний рейтинг танків сесії.</p>

<h4>📦 Архів сесій</h4>
<p>Архів зберігає завершені сесії. Кожну архівну сесію можна повернути назад або видалити. Архів також використовується для розрахунку рейтингу «За останній час».</p>

<h4>🏆 Вкладка «Рейтинг»</h4>
<p>Рейтинг ефективності танків на основі формули: вінрейт, середня шкода, фраги та виживання. Фільтри за рівнем та типом. Чекбокс «За останній час» рахує рейтинг тільки по боях із сесій та архіву.</p>

<h4>⚔️ Вкладка «Порівняння»</h4>
<p>Порівняння двох гравців: введіть ніки або оберіть зі збережених профілів. Після порівняння з’явиться вибір танка з фільтрами (рівень, тип, нація). Кращий показник підсвічується зеленим.</p>

<h4>💾 Експорт / Імпорт</h4>
<p>Кнопка «Експорт» зберігає всі ваші дані (профілі, сесії, налаштування) у JSON-файл. «Імпорт» — завантажує дані з файлу для перенесення на інший пристрій.</p>

<h4>🎨 Тема та мова</h4>

<p>Введите никнейм в поле поиска и нажмите «Поиск». Выберите игрока из списка. Никнейм сохраняется автоматически. Данные кешируются на 15 минут.</p>

<h4>⭐ Сохранённые профили</h4>
<p>Нажмите звёздочку (★) рядом с ником в результатах поиска. Сохранённые профили отображаются под поиском — один клик и статистика загружается. Для удаления нажмите × на профиле.</p>

<h4>📊 Вкладка «Общая»</h4>
<p>Общая статистика аккаунта: бои, винрейт, средний урон, фраги, выживание, точность, засвет и макс. фраги. Графики: распределение боёв, типы танков, нации и уровни.</p>

<h4>🔫 Вкладка «Танки»</h4>

<p><b>Детали танка:</b> нажмите на любую строку — откроется окно с полной статистикой танка и историей по сессиям.</p>

<h4>🎮 Вкладка «Сессия»</h4>
<p>Отслеживание результатов за игровую сессию:</p>
<ol>
<li>Нажмите <b>«Новая сессия»</b> перед игрой (можно указать название)</li>
<li>Сыграйте несколько боёв</li>
<li>Нажмите <b>«Обновить все»</b> — увидите статистику за эту сессию</li>
</ol>
<p>Несколько сессий сразу. Группы по аккаунтам ▲/▼, порядок ☰. Состояние свёрнутости аккаунтов запоминается.</p>
<p><b>⚙ возле «Обновить все»:</b> авторазворот танков, автообновление и какие аккаунты держать открытыми.</p>
<p><b>⚙ на карточке:</b> переименовать, основная (ALL), автосброс, в архив, удалить. Снаружи только <b>«Сбросить»</b>.</p>
<p><b>Основная (ALL):</b> одна на аккаунт; предупреждения на ней не показываются.</p>
<p><b>Предупреждения:</b> слабые танки/классы за последние бои, кулдаун ~10 боёв.</p>
<p><b>VS СРЕДНЕЕ / Лучший-Худший:</b> как раньше.</p>

<h4>📦 Архив сессий</h4>
<p>Архив хранит завершённые сессии. Каждую можно восстановить или удалить. Используется для расчёта рейтинга «За последнее время».</p>

<h4>🏆 Вкладка «Рейтинг»</h4>
<p>Рейтинг эффективности танков по формуле: винрейт, средний урон, фраги и выживание. Фильтры по уровню и типу.</p>

<h4>⚔️ Вкладка «Сравнение»</h4>
<p>Сравнение двух игроков: введите ники и нажмите «Сравнить». Лучший показатель подсвечивается зелёным.</p>

<h4>💾 Экспорт / Импорт</h4>
<p>«Экспорт» сохраняет все данные в JSON-файл. «Импорт» — загружает данные для переноса на другое устройство.</p>

<h4>🎨 Тема и язык</h4>

function t(key) { return (LANG[currentLang] || LANG.uk)[key] || key; }

function applyI18n() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    const gear = $("sessGlobalSettingsBtn");
    if (gear) gear.title = t("sessGlobalSettingsTitle");
    // Dynamic selects
    const tf = document.getElementById("tierFilter");
    if (tf && tf.options[0]) tf.options[0].text = t("allTiers");
    const tyf = document.getElementById("typeFilter");
    if (tyf) {
        tyf.innerHTML = `<option value="">${t("allTypes")}</option>
            <option value="heavyTank">${t("HT")}</option>
            <option value="mediumTank">${t("MT")}</option>
            <option value="lightTank">${t("LT")}</option>
            <option value="AT-SPG">${t("TD")}</option>`;
    }
    const sf = document.getElementById("sortFilter");
    if (sf) {
        const val = sf.value || "battles";
        sf.innerHTML = `<option value="battles">${t("sortBattles")}</option>
            <option value="winrate">${t("sortWR")}</option>
            <option value="avg_dmg">${t("sortDmg")}</option>
            <option value="avg_spot">${t("sortSpot")}</option>
            <option value="accuracy">${t("sortAcc")}</option>`;
        sf.value = val;
    }
    const ctt = $("cmpTankTier");
    if (ctt && ctt.options[0]) ctt.options[0].text = t("allTiers");
    const ctn = $("cmpTankNation");
    if (ctn && ctn.options[0]) ctn.options[0].text = t("allNations");
    renderProfiles();
    const hc = document.getElementById("helpContent");
    if (hc) hc.innerHTML = t("helpContent");
    refreshAutoResetStatus();
}

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem("clstats_lang", lang);
    document.getElementById("langSelect").value = lang;
    applyI18n();
}

function switchTab(tab) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));

    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add("active");

}

// ==================== PROFILES ====================
function getProfiles() {
    return JSON.parse(localStorage.getItem("clstats_profiles") || "[]");
}

function saveProfiles(profiles) {
    localStorage.setItem("clstats_profiles", JSON.stringify(profiles));
}

function saveProfile(id, nick) {
    let profiles = getProfiles();
    if (profiles.some(p => p.id === id)) return;
    profiles.push({ id, nick });
    saveProfiles(profiles);
    renderProfiles();
}

function removeProfile(id) {
    saveProfiles(getProfiles().filter(p => p.id !== id));
    renderProfiles();
}

function setupProfileDragDrop() {
    const list = $("profilesList");
    if (!list) return;
    let dragIdx = null;
    list.querySelectorAll(".profile-chip").forEach(el => {
        el.addEventListener("dragstart", e => {
            dragIdx = +el.dataset.idx;
            el.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
        });
        el.addEventListener("dragend", () => {
            el.classList.remove("dragging");
            list.querySelectorAll(".profile-chip").forEach(x => x.classList.remove("drag-over"));
            dragIdx = null;
        });
        el.addEventListener("dragover", e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            el.classList.add("drag-over");
        });
        el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
        el.addEventListener("drop", e => {
            e.preventDefault();
            el.classList.remove("drag-over");
            const dropIdx = +el.dataset.idx;
            if (dragIdx === null || dragIdx === dropIdx) return;
            const profiles = getProfiles();
            const [moved] = profiles.splice(dragIdx, 1);
            profiles.splice(dropIdx, 0, moved);
            saveProfiles(profiles);
            renderProfiles();
        });
    });
}

function renderProfiles() {
    const list = $("profilesList");
    const profiles = getProfiles();
    if (profiles.length === 0) {
        list.innerHTML = `<span style="color:var(--t2);font-size:.85rem">${t("noProfiles")}</span>`;
        renderCompareProfileQuick();
        return;
    }
    list.innerHTML = profiles.map((p, i) => `
        <div class="profile-chip" draggable="true" data-id="${p.id}" data-nick="${p.nick}" data-idx="${i}">
            <span class="profile-drag" title="Drag">&#9776;</span>
            <span class="nick" style="cursor:pointer">${p.nick}</span>
            <span class="remove" title="${t("remove")}">&times;</span>
        </div>
    `).join("");
    list.querySelectorAll(".profile-chip .nick").forEach(el => {
        el.addEventListener("click", () => {
            const chip = el.closest(".profile-chip");
            loadPlayer(+chip.dataset.id, chip.dataset.nick);
        });
    });
    list.querySelectorAll(".profile-chip .remove").forEach(el => {
        el.addEventListener("click", e => {
            e.stopPropagation();
            removeProfile(+el.closest(".profile-chip").dataset.id);
        });
    });
    setupProfileDragDrop();
    renderCompareProfileQuick();
}

function renderCompareProfileQuick() {
    const el = $("cmpProfileQuick");
    if (!el) return;
    const profiles = getProfiles();
    if (!profiles.length) {
        el.innerHTML = "";
        return;
    }
    el.innerHTML = `<span style="font-size:.75rem;color:var(--t2)">${t("compareQuickPick")}:</span>` +
        profiles.map(p => `<button type="button" class="quick-chip" data-nick="${p.nick.replace(/"/g, "&quot;")}">${p.nick}</button>`).join("");
    el.querySelectorAll(".quick-chip").forEach(btn => {
        btn.addEventListener("click", () => {
            const nick = btn.dataset.nick;
            const i1 = $("cmpInput1"), i2 = $("cmpInput2");
            if (!i1.value.trim()) i1.value = nick;
            else if (!i2.value.trim()) i2.value = nick;
            else i2.value = nick;
        });
    });
}

// ==================== API CACHE ====================
function _cacheGet(k) {
    try {
        const raw = localStorage.getItem('clscache:' + k);
        if (!raw) return null;
        const {d, ts, maxAge} = JSON.parse(raw);
        return Date.now() - ts < maxAge ? {data: d, ageMs: Date.now() - ts} : null;
    } catch(_) { return null; }
}
function _cacheSet(k, d, maxAge) {
    try { localStorage.setItem('clscache:' + k, JSON.stringify({d, ts: Date.now(), maxAge})); } catch(_) {}
}
function _cacheDel(prefix) {
    // Delete all cache keys containing prefix
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('clscache:') && k.includes(prefix)) keys.push(k);
    }
    keys.forEach(k => localStorage.removeItem(k));
}

// ==================== API ====================
async function api(endpoint, params = {}, cacheMs = 0) {
    params.application_id = API_ID;
    const qs = new URLSearchParams(params).toString();
    const ckey = endpoint + ':' + qs;
    if (cacheMs > 0) {
        const hit = _cacheGet(ckey);
        if (hit) return hit.data;
    }
    const resp = await fetch(`${BASE}/${endpoint}/?${qs}`);
    const data = await resp.json();
    if (cacheMs > 0 && data.status === 'ok') _cacheSet(ckey, data, cacheMs);
    return data;
}

async function loadTankDisplayNames() {
    try {
        const r = await fetch("./tank_names.json");
        const data = await r.json();
        if (data.ok) {
            tankDisplayLookup = {
                byTankId: data.byTankId || {},
                byName: data.byName || {},
            };
            staticTankInfo = data.tankInfo || {};
        }
    } catch (e) {
        console.warn("tank names:", e);
    }
}

function _tankTechTail(name) {
    let s = String(name || "").trim();
    s = s.replace(/^[^:]+:\s*/, "");
    const m = s.match(/^[A-Za-z]{1,4}\d+_(.+)$/);
    return m ? m[1] : s;
}

function tankDisplayName(wgName, tankId) {
    const base = String(wgName || "").trim() || "—";
    const tid = tankId != null && tankId !== "" ? String(tankId) : "";
    if (tid && tankDisplayLookup.byTankId && tankDisplayLookup.byTankId[tid]) {
        return tankDisplayLookup.byTankId[tid];
    }
    const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    const probes = [base];
    const tail = _tankTechTail(base);
    if (tail && tail !== base) probes.push(tail);
    for (const p of probes) {
        const nk = norm(p);
        if (nk && tankDisplayLookup.byName && tankDisplayLookup.byName[nk]) {
            return tankDisplayLookup.byName[nk];
        }
    }
    return base;
}

/** Перевірити назву з бібліотеки (навіть якщо diff збережено до оновлення tank_names.json). */
function resolveStoredTankName(d) {
    const tid = d.tank_id != null ? String(d.tank_id) : "";
    const cached = String(d.tank_name || "").trim();
    const stale = !cached || cached === "?" || cached.startsWith("#") || /^\d+$/.test(cached);
    const wg = stale ? (tankDisplayLookup.byTankId[tid] || cached) : cached;
    const resolved = tankDisplayName(wg, d.tank_id);
    if (resolved && resolved !== "—") return resolved;
    return cached && !cached.startsWith("#") ? cached : (tid ? `#${tid}` : "?");
}

async function getTankInfo() {
    if (Object.keys(tankInfoCache).length > 0) {
        if (!Object.keys(tankDisplayLookup.byTankId || {}).length) {
            await loadTankDisplayNames();
        }
        return tankInfoCache;
    }
    const [data] = await Promise.all([
        api("encyclopedia/vehicles", { fields: "name,tier,type,nation,is_premium,images.preview" }, 86400000),
        loadTankDisplayNames(),
    ]);
    if (data.status === "ok" && data.data) tankInfoCache = data.data;
    for (const [id, info] of Object.entries(staticTankInfo)) {
        if (!tankInfoCache[id]) tankInfoCache[id] = info;
    }
    for (const [id, info] of Object.entries(TANK_NAMES)) {
        if (!tankInfoCache[id]) tankInfoCache[id] = info;
    }
    for (const [id, info] of Object.entries(tankInfoCache)) {
        const wg = info.name || tankDisplayLookup.byTankId[id] || "";
        info.name = tankDisplayName(wg, id);
    }
    return tankInfoCache;
}

async function doSearch() {
    const query = $("searchInput").value.trim();
    if (!query) return;

    const sr = $("searchResults");
    sr.innerHTML = `<div class="loading">${t("loading")}</div>`;
    sr.classList.remove("hidden");

    try {
        const data = await api("account/list", { search: query, type: "startswith", limit: 10 });
        if (data.status === "ok" && data.data && data.data.length > 0) {
            const profiles = getProfiles();
            sr.innerHTML = data.data.map(p => {
                const isSaved = profiles.some(pr => pr.id === p.account_id);
                return `<div class="result-item" data-id="${p.account_id}" data-nick="${p.nickname}">
                    <div><span class="nickname">${p.nickname}</span><span class="account-id">ID: ${p.account_id}</span></div>
                    <span class="save-icon ${isSaved ? 'saved' : ''}" title="${t("save")}">&#9733;</span>
                </div>`;
            }).join("");
            sr.querySelectorAll(".result-item").forEach(el => {
                el.querySelector(".nickname").parentElement.addEventListener("click", () => loadPlayer(+el.dataset.id, el.dataset.nick));
                el.querySelector(".save-icon").addEventListener("click", e => {
                    e.stopPropagation();
                    const icon = e.target;
                    if (icon.classList.contains("saved")) {
                        removeProfile(+el.dataset.id);
                        icon.classList.remove("saved");
                    } else {
                        saveProfile(+el.dataset.id, el.dataset.nick);
                        icon.classList.add("saved");
                    }
                });
            });
        } else {
            sr.innerHTML = `<div style="padding:12px 16px;color:var(--t2)">${t("noResults")}</div>`;
        }
    } catch (err) {
        sr.innerHTML = `<div style="padding:12px 16px;color:#e74c3c">${t("searchError")}</div>`;
    }
}

async function loadPlayer(accountId, nickname) {
    $("searchResults").classList.add("hidden");
    $("searchInput").value = nickname;
    $("playerSection").classList.remove("hidden");
    currentAccountId = accountId;
    localStorage.setItem("clstats_player", JSON.stringify({ id: accountId, nick: nickname }));

    $("playerName").textContent = nickname;
    $("lastBattle").textContent = t("loading") + "...";
    resetStats();

    try {
        const CACHE_15M = 900000; // 15 min
        const [playerData, tanksData, tankInfo] = await Promise.all([
            api("account/info", { account_id: accountId }, CACHE_15M),
            api("tanks/stats", { account_id: accountId }, CACHE_15M),
            getTankInfo()
        ]);

        if (playerData.status === "ok") displayPlayerStats(playerData.data[String(accountId)]);


        if (tanksData.status === "ok") {
            let tanks = tanksData.data[String(accountId)] || [];
            enrichTanks(tanks, tankInfo);
            allTankData = tanks;
            displayTankTable(tanks);
            displayCharts(tanks);
            syncAccountSessions(accountId, tanks);
        }
        focusAccountGroupForPlayer(accountId);
        if (localStorage.getItem("clstats_autohide_inactive") === "1") renderSessions();
    } catch (err) {
        console.error("Error:", err);
        $("lastBattle").textContent = t("errorData");
    }
}

function enrichTanks(tanks, tankInfo) {
    tanks.forEach(t => {
        const info = tankInfo[String(t.tank_id)] || {};
        t.tank_name = resolveStoredTankName({ tank_id: t.tank_id, tank_name: info.name || tankDisplayLookup.byTankId[String(t.tank_id)] || "" });
        t.tank_tier = info.tier || 0;
        t.tank_type = info.type || "";
        t.tank_nation = info.nation || "unknown";
        t.is_premium = info.is_premium || false;
        t.tank_image = (info.images || {}).preview || "";
        t.in_encyclopedia = !!info.name;
    });
}

function displayPlayerStats(player) {
    if (!player || !player.statistics) return;
    const s = player.statistics.all;
    const b = s.battles || 0;

    $("playerName").textContent = player.nickname;
    if (player.last_battle_time) {
        const d = new Date(player.last_battle_time * 1000);
        $("lastBattle").textContent = `${t("lastBattle")} ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;
    }

    $("statBattles").textContent = b.toLocaleString();
    const wr = b > 0 ? (s.wins / b * 100) : 0;
    const wrEl = $("statWinrate");
    wrEl.textContent = wr.toFixed(2) + "%";
    wrEl.className = "stat-value " + getWrClass(wr);
    $("statAvgDmg").textContent = (b > 0 ? Math.round(s.damage_dealt / b) : 0).toLocaleString();
    $("statAvgFrags").textContent = b > 0 ? (s.frags / b).toFixed(2) : "0";
    $("statSurvival").textContent = b > 0 ? (s.survived_battles / b * 100).toFixed(1) + "%" : "0%";
    $("statAccuracy").textContent = s.shots > 0 ? (s.hits / s.shots * 100).toFixed(1) + "%" : "0%";
    $("statAvgSpot").textContent = b > 0 ? ((s.spotted || 0) / b).toFixed(1) : "0";
    const wr1 = b > 0 ? (s.wins / b * 100) : 0;
    if (b > 0 && wr1 < 99) {
        const targetWhole = Math.ceil(wr1);
        const winsToWhole = targetWhole > wr1 ? Math.ceil((targetWhole / 100 * b - s.wins) / (1 - targetWhole / 100)) : 0;
        const winsTo1Pct = Math.ceil(b / (99 - wr1));
        $("statWinsFor1Pct").innerHTML = `<span class="stat-value">${winsToWhole}</span><span style="color:var(--brd);font-size:1.2rem">│</span><span class="stat-value">${winsTo1Pct}</span>`;
        $("statWinsLabel").innerHTML = `${t("winsToWhole")} (${targetWhole}%) │ ${t("winsFor1Pct")}`;
    } else {
        $("statWinsFor1Pct").innerHTML = `<span class="stat-value">—</span>`;
        $("statWinsLabel").textContent = t("winsFor1Pct");
    }
    $("statMaxFrags").textContent = s.max_frags || 0;
}

function getWrClass(wr) {
    if (wr >= 70) return "wr-unicum";
    if (wr >= 60) return "wr-great";
    if (wr >= 50) return "wr-good";
    return "wr-avg";
}

    tanks.forEach(tk => { const s = tk.all; if (!s) return; wins += s.wins || 0; losses += s.losses || 0; draws += (s.battles||0) - (s.wins||0) - (s.losses||0); });

        options: { responsive: true, plugins: { legend: { position: "bottom", labels: { color: lc } } } }
    });

    const typeMap = { heavyTank: 0, mediumTank: 0, lightTank: 0, "AT-SPG": 0 };
    tanks.forEach(tk => { if (tk.tank_type && tk.all) typeMap[tk.tank_type] = (typeMap[tk.tank_type] || 0) + (tk.all.battles || 0); });

    if (tankTypesChart) tankTypesChart.destroy();

        options: { responsive: true, plugins: { legend: { position: "bottom", labels: { color: lc } } } }
    });

    // Nations chart
    const NATION_COLORS = { ussr:"#e74c3c", germany:"#888", usa:"#5cc9e8", france:"#3366cc", uk:"#cd7f32", china:"#ffd700", japan:"#ff69b4", european:"#7ecb54", other:"#c8a84e", unknown:"#555" };
    const nationMap = {};
    tanks.forEach(tk => { if (tk.tank_nation && tk.all) { const n = NATION_MERGE[tk.tank_nation] || tk.tank_nation; nationMap[n] = (nationMap[n] || 0) + (tk.all.battles || 0); } });
    const nationEntries = Object.entries(nationMap).sort((a, b) => b[1] - a[1]);

    if (nationsChart) nationsChart.destroy();
    nationsChart = new Chart($("nationsChart"), {
        type: "doughnut",
        data: { labels: nationEntries.map(([n]) => NATION_NAMES[n] || n), datasets: [{ data: nationEntries.map(([,v]) => v), backgroundColor: nationEntries.map(([n]) => NATION_COLORS[n] || "#999"), borderWidth: 0 }] },
        options: { responsive: true, plugins: { legend: { position: "bottom", labels: { color: lc } } } }
    });

    // Tiers chart
    const tierMap = {};
    tanks.forEach(tk => { if (tk.tank_tier && tk.all) tierMap[tk.tank_tier] = (tierMap[tk.tank_tier] || 0) + (tk.all.battles || 0); });
    const tierLabels = []; const tierData = [];
    for (let i = 1; i <= 10; i++) { tierLabels.push(TIER_ROMAN[i] || i); tierData.push(tierMap[i] || 0); }

    if (tiersChart) tiersChart.destroy();
    tiersChart = new Chart($("tiersChart"), {
        type: "bar",
        data: { labels: tierLabels, datasets: [{ data: tierData, backgroundColor: "#f5a623", borderRadius: 4 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: lc } }, y: { ticks: { color: lc }, grid: { color: "rgba(255,255,255,0.05)" } } } }
    });
}

const TIER_ROMAN = {1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII",8:"VIII",9:"IX",10:"X"};
const TYPE_KEY = { heavyTank:"HT", mediumTank:"MT", lightTank:"LT", "AT-SPG":"TD" };
const NATION_MERGE = { czech:"european", italy:"european" };
const NATION_NAMES = { ussr:"СРСР", germany:"Німеччина", usa:"США", france:"Франція", uk:"Британія", china:"Китай", japan:"Японія", european:"Зб. Європи", other:"Зб. нація", unknown:"???" };

let _cmpTankPool = [];

let currentSort = "battles";
let sortDir = "desc"; // "asc" or "desc"

function setSort(field) {
    if (currentSort === field) {
        sortDir = sortDir === "desc" ? "asc" : "desc";
    } else {
        currentSort = field;
        sortDir = "desc";
    }
    // Sync dropdown if it has this value
    const sf = $("sortFilter");
    if ([...sf.options].some(o => o.value === field)) sf.value = field;
    // Update header classes
    document.querySelectorAll("#tab-tanks th.sortable").forEach(th => {
        th.classList.remove("sort-asc", "sort-desc");
        if (th.dataset.sort === currentSort) th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
    });

}

function getSortValue(tk, field) {
    const s = tk.all, b = s.battles || 0;
    switch (field) {
        case "name": return (tk.tank_name || "").toLowerCase();
        case "tier": return tk.tank_tier || 0;
        case "type": return tk.tank_type || "";
        case "battles": return b;
        case "winrate": return b > 0 ? s.wins / b : 0;
        case "avg_dmg": return b > 0 ? s.damage_dealt / b : 0;
        case "avg_frags": return b > 0 ? s.frags / b : 0;
        case "avg_spot": return b > 0 ? (s.spotted || 0) / b : 0;
        case "accuracy": return s.shots > 0 ? s.hits / s.shots : 0;
        case "max_xp": return s.max_xp || 0;
        case "wins_for_1pct": { const wr = b > 0 ? s.wins/b*100 : 0; return wr >= 99 ? 99999 : Math.ceil(b/(99-wr)); }
        default: return b;
    }
}

let _displayedTanks = [];
const _sessionScoredTanks = {};

function displayTankTable(tanks) {
    const tbody = $("tankTableBody");
    let filtered = tanks.filter(tk => tk.all && tk.all.battles > 0);

    if ($("hideRemoved").checked) filtered = filtered.filter(tk => tk.in_encyclopedia);

    const search = $("tankSearch").value.trim().toLowerCase();
    if (search) filtered = filtered.filter(tk => (tk.tank_name || "").toLowerCase().includes(search));

    const tier = $("tierFilter").value;
    if (tier) filtered = filtered.filter(tk => tk.tank_tier == tier);
    const type = $("typeFilter").value;
    if (type) filtered = filtered.filter(tk => tk.tank_type === type);

    filtered.sort((a, b) => {
        const va = getSortValue(a, currentSort), vb = getSortValue(b, currentSort);
        let cmp = 0;
        if (typeof va === "string") cmp = va.localeCompare(vb);
        else cmp = va - vb;
        return sortDir === "desc" ? -cmp : cmp;
    });

    _displayedTanks = filtered;
    tbody.innerHTML = filtered.map((tk, idx) => {
        const s = tk.all, b = s.battles || 0;
        const wr = b > 0 ? (s.wins / b * 100) : 0;
        const avgDmg = b > 0 ? Math.round(s.damage_dealt / b) : 0;
        const avgFrags = b > 0 ? (s.frags / b).toFixed(2) : "0";
        const avgSpot = b > 0 ? ((s.spotted || 0) / b).toFixed(1) : "—";
        const acc = fmtAccPct(s.hits, s.shots);
        const nc = tk.is_premium ? "premium" : "";
        const img = tk.tank_image ? `<img src="${tk.tank_image}" alt="" loading="lazy">` : "";
        const name = tk.tank_name || `#${tk.tank_id}`;
        return `<tr data-disp-idx="${idx}" style="cursor:pointer" title="${t('tankDetails')}">
            <td><div class="tank-name-cell">${img}<span class="${nc}">${name}</span></div></td>
            <td>${TIER_ROMAN[tk.tank_tier] || tk.tank_tier}</td>
            <td>${t(TYPE_KEY[tk.tank_type] || "") || tk.tank_type || "?"}</td>
            <td>${b.toLocaleString()}</td>
            <td class="${getWrClass(wr)}">${wr.toFixed(1)}%</td>
            <td>${avgDmg.toLocaleString()}</td>
            <td>${avgFrags}</td>
            <td>${avgSpot}</td>
            <td>${acc}</td>
            <td>${(s.max_xp || 0).toLocaleString()}</td>
            <td>${wr >= 99 ? "∞" : Math.ceil(b / (99 - wr))}</td>
        </tr>`;
    }).join("");

    tbody.querySelectorAll("tr[data-disp-idx]").forEach(row => {
        row.addEventListener("click", () => openTankModal(_displayedTanks[+row.dataset.dispIdx]));
    });
}

    // Session history for this tank from all sessions + archive
